services:
  postgres:
    image: postgres:16
    container_name: sunshine-reading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sunshine_reading
      POSTGRES_USER: sunshine_user
      POSTGRES_PASSWORD: sunshine_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunshine_user -d sunshine_reading"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
